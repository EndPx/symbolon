name: Frontend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Shared DevNet runner guards
        run: node --test ../scripts/test/shared-devnet.test.mjs ../scripts/test/shared-devnet-launch.test.mjs
      - name: Retained shared DevNet evidence
        working-directory: .
        run: node scripts/verify-shared-devnet-evidence.mjs
      - name: Exported public borrower receipt
        working-directory: .
        run: node scripts/verify-public-devnet-evidence.mjs
      - run: npm test
      - run: npm run build
      - name: Repository-root API compilation
        run: node node_modules/typescript/bin/tsc --noEmit -p ../tsconfig.json
